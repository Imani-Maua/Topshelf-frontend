services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80" #mapping machine port 8080 to container port 80

    depends_on:
      - backend

  backend:
    build:
      context: ../TopShelf-backend
    ports:
      - "3000:3000"
    env_file:
      - ../TopShelf-backend/.env
